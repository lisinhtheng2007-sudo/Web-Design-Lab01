<!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <title>Product Information</title>
            <style>
                th, td { padding: 8px 8px; text-align: center; }
                th { background-color: #ddd; }
            </style>
        </head>
        <body>
            <h1 style="text-align: center">Welcome to CADT Shop!</h1>
            <h2 style="text-align: center">Product Catalog</h2>
            <table border="1" cellspacing="0" align="center" >
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>In Stock</th>
                    <th>Thumbnail</th>

                </tr>
                <tr>
                    <td>C# Book</td>
                    <td>10$</td>
                    <td>5</td>
                    <td>YES</td>
                    <td><img src="csharp.jpg" alt="C# Book" width="65"></td>
                </tr>
                <tr>
                    <td>CADT Polo</td>
                    <td>$12</td>
                    <td>60</td>
                    <td>YES</td>
                    <td><img src="cadtpolo.jpg" alt="CADT Polo" width="100"></td>
                </tr>
                <tr>
                    <td>CADT mouse</td>
                    <td>$100</td>
                    <td>3</td>
                    <td>NO</td>
                    <td><img src="mouse.jpg" alt="CADT mouse" width="110"></td>
                </tr>
            </table>
        </body>
    </html>
